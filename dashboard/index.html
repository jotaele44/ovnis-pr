    <script>
      // Apply a stored light/system theme before first paint (the page defaults to
      // dark). Mirrors lib/theme.js applyTheme; storage may be unavailable.
      try {
        var m = localStorage.getItem('ovnis.theme');
        var light = m === 'light' || (m === 'system' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (light) {
          var r = document.documentElement;
          r.dataset.theme = 'light';
          r.classList.remove('dark');
          r.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
