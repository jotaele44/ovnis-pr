name: Unified Skillpack Conformance
on:
  pull_request:
    paths: ['.claude/skillpacks/**','tools/validate_unified_skillpacks.py','tests/test_unified_skillpack_conformance.py','.github/workflows/unified-skillpack-conformance.yml']
  push:
    branches: ['chore/unified-skillpacks-v1.0.0-*']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Validate skillpack conformance
        run: python tools/validate_unified_skillpacks.py --root .
      - run: python -m unittest discover -s tests -p 'test_unified_skillpack_conformance.py'
