name: OVNIS recovery successor v1 — provenance and governed intake
on:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".recovery/ovnis-successor-v1/**"
      - ".github/workflows/recovery-ovnis-successor-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  successor-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Reproduce exact semantic 250-test baseline
        shell: bash
        run: bash .recovery/ovnis-exact/run_exact.sh
      - name: Apply successor v1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          cp .recovery/ovnis-successor-v1/ovnisArtifactProvenance.tsx "$ROOT/helpers/ovnisArtifactProvenance.tsx"
          cp .recovery/ovnis-successor-v1/ovnisArtifactProvenance.spec.tsx "$ROOT/helpers/ovnisArtifactProvenance.spec.tsx"
          cp .recovery/ovnis-successor-v1/ovnisClaimsIntake.tsx "$ROOT/helpers/ovnisClaimsIntake.tsx"
          cp .recovery/ovnis-successor-v1/ovnisClaimsIntake.spec.tsx "$ROOT/helpers/ovnisClaimsIntake.spec.tsx"
          cd "$ROOT"
          sha256sum helpers/ovnisArtifactProvenance.tsx helpers/ovnisArtifactProvenance.spec.tsx helpers/ovnisClaimsIntake.tsx helpers/ovnisClaimsIntake.spec.tsx > successor-v1-overlay-hashes.txt
      - name: Execute successor v1 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          mapfile -t exec_specs < <(awk -F '\t' '$2=="EXECUTABLE" || $2=="RECONSTRUCTED_SEMANTIC_SUPERSESSION"{print $1}' recovery-spec-classification.tsv)
          exec_specs+=(helpers/ovnisArtifactProvenance.spec.tsx helpers/ovnisClaimsIntake.spec.tsx)
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose "${exec_specs[@]}" 2>&1 | tee successor-v1-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-test-exit.txt
          test "$status" = "0"
          grep -q "262 passed" successor-v1-vitest.log
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vite build 2>&1 | tee successor-v1-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-build-exit.txt
          test "$status" = "0"
      - name: Freeze successor v1 receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=ovnis-recovery-successor/v1"
            echo "baseline_tests=250"
            echo "successor_v1_tests=262"
            echo "artifact_references=244"
            echo "verified_artifact_bytes=0"
            echo "artifact_promotion=HASH_SIZE_TIME_AUTHORITY_REQUIRED"
            echo "claims=SOURCE_BACKED_ONLY"
            echo "contradictions=NO_AUTOMATIC_WINNER"
            echo "governed_intake=DUPLICATE_AND_HASH_GATES"
            echo "state=PASS"
          } > successor-v1-receipt.txt
          sha256sum package-lock.json successor-v1-overlay-hashes.txt successor-v1-vitest.log successor-v1-build.log successor-v1-receipt.txt > successor-v1-evidence-hashes.txt
      - name: Upload successor v1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovnis-recovery-successor-v1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/successor-v1-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v1-vitest.log
            ${{ runner.temp }}/recovered/successor-v1-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-build.log
            ${{ runner.temp }}/recovered/successor-v1-build-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-receipt.txt
            ${{ runner.temp }}/recovered/successor-v1-evidence-hashes.txt
