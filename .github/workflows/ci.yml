name: OVNIS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate dependency planes before installation
        run: python3 scripts/validate_dependency_planes.py
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Case schema is well-formed JSON
        run: python -c "import json; json.load(open('data/schemas/case.schema.json')); print('schema ok')"
      - name: Validate case ledgers
        run: python3 scripts/validate_case_ledgers.py
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.lock httpx -r server/backend/requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Run unit tests
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Export canonical streams (smoke)
        run: |
          python3 scripts/federation_export.py --mode test
          test -f exports/federation/manifest.json
      - name: Production export succeeds with real case data
        run: |
          python3 scripts/federation_export.py --mode production
          test -f exports/federation/manifest.json
          echo "OK: production export completed with real case data"

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Recompile runtime and development lockfiles
        run: |
          uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock
          uv pip compile requirements-dev.txt --universal --python-version 3.12 -o requirements-dev.lock
          python3 scripts/validate_dependency_planes.py
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock requirements-dev.lock; then
            echo "::error::dependency locks are out of date. Recompile requirements.lock and requirements-dev.lock with Python 3.12."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate dependency planes before installation
        run: python3 scripts/validate_dependency_planes.py
      - name: Install lint deps
        run: |
          python -m pip install ruff mypy -r requirements.lock
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Ruff
        run: ruff check .
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
