name: FEDERATION LOCKSTEP

on:
  pull_request:
    branches: [main, lockstep-reference-v1]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Nonzero 40-character base SHA"
        required: true
        type: string
      head_sha:
        description: "Nonzero 40-character head SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: federation-lockstep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockstep:
    name: federation-lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate Lockstep manifests
        run: python -m lockstep.engine validate

      - name: Validate affected peer receipts
        run: python -m lockstep.peer_receipts

      - name: Run positive, adversarial, boundary, and recovery fixtures
        run: >-
          python -m unittest
          tests.test_lockstep_reference
          tests.test_lockstep_strict_gate
          tests.test_lockstep_contract_signatures
          tests.test_lockstep_deployment_boundary
          tests.test_lockstep_recovery
          -v

      - name: Evaluate change under strict Lockstep policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || inputs.base_sha) }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha || inputs.head_sha) }}
        run: |
          python -m lockstep.strict_gate \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
